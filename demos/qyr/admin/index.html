<html lang="ru">

  <link rel="icon" href="../../../assets/mark.png" type="image/png">
  <link rel="stylesheet" href="../../../assets/vendor/design-tokens.css">
  <link rel="stylesheet" href="../../../assets/base.css">
  <link rel="stylesheet" href="../../../assets/barber.css">
  <script src="../../../assets/site-links.js" defer></script>

<body class="qyr q-crm">
  <a class="skip-link" href="#main">К содержанию</a>
  <header class="demo-bar">
    <nav class="shell" aria-label="Навигация">
      <a class="top-link" href="../#booking" data-local-index><span class="arrow back" aria-hidden="true"></span> На сайт QYR</a>
      <span class="brand-word" translate="no">QYR</span>
      <div class="languages" role="group" aria-label="Язык сайта"><span aria-current="true" lang="ru" title="Русский">RU</span><a href="../../../kk/demos/qyr/admin/" lang="kk" hreflang="kk" aria-label="Қазақша" data-local-index>KK</a></div>

  <nav class="shell q-mode" id="qyr-mode" aria-label="Режимы демонстрации"></nav>
  <div class="shell q-crm-layout">

      <nav id="qyr-crm-nav" aria-label="Разделы CRM"></nav>

      <p id="qyr-notice" class="q-notice" role="status"></p>
      <section id="qyr-crm-view" aria-labelledby="qyr-crm-heading">
        <p class="q-muted">Загружаем демо…</p>
        <noscript><p>Для работы демопанели нужен JavaScript.</p></noscript>
      </section>
    </main>
